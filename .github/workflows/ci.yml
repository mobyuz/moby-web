name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: moby-web
          persist-credentials: false
      # @mobyuz/moby-ui is linked with file:../moby-ui and is not published yet, so build it from a
      # pinned commit next to this checkout. It needs moby-protocol for its types, built from the
      # same commit the desktop app pins. All Moby repositories are public, so no token is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mobyuz/moby-protocol
          ref: 0ddc9a9befddb59082ec35e354512b3d72129fcf
          path: moby-protocol
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mobyuz/moby-ui
          ref: 62de4e31ea598205dcc07bcbedb775ce0820a5ab
          path: moby-ui
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: moby-web/.node-version
          cache: npm
          cache-dependency-path: moby-web/package-lock.json
      - run: npm install --global npm@11.6.2
      - name: Build moby-protocol
        working-directory: moby-protocol
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build moby-ui
        working-directory: moby-ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Install website dependencies
        working-directory: moby-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checks
        working-directory: moby-web
        run: |
          npm run api:check
          npm run lint
          npm run typecheck
          npm run build
      # Against a production build (made by the Playwright config with the test Turnstile key):
      # it is what ships, and it is much lighter than the dev server for the software-GL 3D tests.
      - name: Browser tests
        working-directory: moby-web
        env:
          MOBY_E2E_PREVIEW: "1"
        run: |
          npx --no-install playwright install --with-deps chromium
          npm test -- --workers=1
      - name: Keep test results when browser tests fail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: moby-web/test-results/
          retention-days: 7
